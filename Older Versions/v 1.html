<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>НЕЙРОМЕТОД AI</title>
    <meta name="description" content="AI-инструменты для проектирования обучения: от сырого запроса до практических заданий">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f5ef;
            --surface: #ffffff;
            --surface-2: #eef4f2;
            --ink: #1f2a2a;
            --muted: #69706d;
            --line: #d9ded7;
            --teal: #19736b;
            --teal-dark: #105d56;
            --teal-deep: #083b35;
            --berry: #a23e55;
            --amber: #c57a1c;
            --green: #238457;
            --yellow: #b98317;
            --red: #b6453f;
            --shadow: 0 20px 48px rgba(31, 42, 42, 0.12);
            --radius-sm: 7px;
            --radius-md: 9px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        /* ----- TOPBAR с градиентом ----- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 14px clamp(18px, 4vw, 54px);
            background: linear-gradient(125deg, #083b35 0%, #115f55 40%, #19736b 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .brand-mark {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 18px;
            color: #ffffff;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }

        .brand:hover .brand-mark {
            background: rgba(255, 255, 255, 0.25);
        }

        .brand strong,
        .brand small {
            display: block;
        }

        .brand small {
            font-size: 12px;
            opacity: 0.8;
            letter-spacing: 0.02em;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav a {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        .nav a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }

        /* ----- ГЛАВНАЯ ОБЛАСТЬ ----- */
        .app {
            min-height: 70vh;
        }

        .section {
            padding: 54px clamp(18px, 4vw, 54px);
        }

        .section-inner {
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
            gap: clamp(26px, 5vw, 72px);
            align-items: center;
            min-height: calc(100vh - 78px);
            padding-top: 38px;
            padding-bottom: 44px;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--berry);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        h1 {
            max-width: 900px;
            margin-bottom: 18px;
            font-size: clamp(46px, 8vw, 94px);
            line-height: 0.96;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            max-width: 720px;
            margin-bottom: 18px;
            font-size: clamp(22px, 3vw, 34px);
            line-height: 1.14;
        }

        .hero-copy {
            max-width: 760px;
            color: var(--muted);
            font-size: 18px;
        }

        .hero-actions,
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 11px 20px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease, opacity 150ms ease;
            white-space: nowrap;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.primary {
            color: #fff;
            background: var(--teal);
            box-shadow: 0 10px 22px rgba(25, 115, 107, 0.25);
        }

        .button.primary:hover {
            background: var(--teal-dark);
            box-shadow: 0 14px 28px rgba(25, 115, 107, 0.3);
        }

        .button.secondary {
            color: var(--ink);
            background: var(--surface);
            border-color: var(--line);
        }

        .button.secondary:hover {
            background: #f0f0eb;
        }

        .button.ghost {
            color: var(--teal-dark);
            background: transparent;
            border-color: var(--line);
        }

        .button.ghost:hover {
            background: var(--surface-2);
            border-color: var(--teal);
        }

        .button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        .hero-panel {
            padding: 28px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .flow {
            display: grid;
            gap: 10px;
            margin: 22px 0 0;
        }

        .flow span {
            display: block;
            padding: 11px 14px;
            background: var(--surface-2);
            border-left: 4px solid var(--teal);
            border-radius: var(--radius-sm);
            color: var(--ink);
            font-weight: 700;
        }

        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .section-head h2 {
            margin-bottom: 6px;
            font-size: clamp(28px, 4vw, 44px);
            line-height: 1.08;
        }

        .section-head p {
            max-width: 720px;
            color: var(--muted);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .tool-card,
        .result-card,
        .lead-box,
        .tool-workspace,
        .audience-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
        }

        .tool-card {
            display: flex;
            min-height: 300px;
            flex-direction: column;
            gap: 14px;
            padding: 24px;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .tool-card:hover {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
            border-color: #bcc9c0;
        }

        .tool-card h3 {
            margin-bottom: 4px;
            font-size: 22px;
            line-height: 1.2;
        }

        .stage {
            width: fit-content;
            padding: 5px 10px;
            color: var(--teal-dark);
            background: #e0ede8;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .meta-list {
            display: grid;
            gap: 8px;
            margin: 0;
        }

        .meta-list div {
            display: grid;
            gap: 2px;
        }

        .meta-list dt {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .meta-list dd {
            margin: 0;
        }

        .tool-card .button {
            margin-top: auto;
        }

        .audience-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 14px;
        }

        .audience-item {
            min-height: 108px;
            padding: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: box-shadow 0.2s;
        }

        .audience-item:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .warning {
            padding: 14px 18px;
            color: #5c4215;
            background: #fff6de;
            border: 1px solid #ecd08c;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
        }

        .tool-hero {
            padding-bottom: 26px;
        }

        .back-link {
            display: inline-flex;
            margin-bottom: 22px;
            color: var(--teal-dark);
            font-weight: 800;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .tool-page-title {
            display: grid;
            gap: 10px;
            max-width: 900px;
        }

        .tool-page-title h1 {
            margin-bottom: 2px;
            font-size: clamp(38px, 6vw, 72px);
        }

        .tool-page-title p {
            color: var(--muted);
            font-size: 18px;
        }

        .tool-workspace {
            display: grid;
            grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1fr);
            gap: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .form-panel {
            padding: 28px;
            border-right: 1px solid var(--line);
            background: #fbfaf6;
        }

        .result-panel {
            min-height: 620px;
            padding: 28px;
            background: var(--surface);
        }

        .form {
            display: grid;
            gap: 18px;
            margin-top: 18px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field label {
            font-weight: 800;
        }

        .field small {
            color: var(--muted);
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid #cfd7d2;
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input,
        .field select {
            min-height: 44px;
            padding: 9px 12px;
        }

        .field textarea {
            min-height: 138px;
            resize: vertical;
            padding: 12px;
        }

        .field textarea.main-input {
            min-height: 260px;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(25, 115, 107, 0.14);
        }

        .char-counter {
            justify-self: end;
            color: var(--muted);
            font-size: 12px;
        }

        .empty-result,
        .loader {
            display: grid;
            min-height: 360px;
            place-items: center;
            color: var(--muted);
            text-align: center;
        }

        .loader span {
            display: block;
            width: 38px;
            height: 38px;
            margin: 0 auto 16px;
            border: 4px solid #dbe5e0;
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .result-grid {
            display: grid;
            gap: 14px;
        }

        .result-card {
            padding: 20px;
        }

        .result-card h3 {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 800;
        }

        .result-card ul {
            margin: 0;
            padding-left: 20px;
        }

        .result-card li+li {
            margin-top: 6px;
        }

        .result-card pre {
            overflow: auto;
            margin: 0;
            white-space: pre-wrap;
        }

        .check-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .status-dot {
            flex: 0 0 auto;
            width: 12px;
            height: 12px;
            margin-top: 7px;
            border-radius: 50%;
        }

        .status-green {
            background: var(--green);
        }

        .status-yellow {
            background: var(--yellow);
        }

        .status-red {
            background: var(--red);
        }

        .status-neutral {
            background: var(--muted);
        }

        .cta-strip {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 20px;
            padding: 20px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
        }

        .lead-box {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 28px;
            padding: 28px;
        }

        .lead-form {
            display: grid;
            gap: 14px;
        }

        .lead-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .message {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
        }

        .message.error {
            color: #7d211d;
            background: #fde9e7;
            border: 1px solid #f0aaa5;
        }

        .message.success {
            color: #125739;
            background: #e4f5ed;
            border: 1px solid #a7dec5;
        }

        .feedback {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 16px;
            color: var(--muted);
        }

        .feedback button {
            min-width: 38px;
            min-height: 34px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: var(--surface);
            cursor: pointer;
            transition: background 0.2s;
        }

        .feedback button:hover {
            background: var(--surface-2);
        }

        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            padding: 24px clamp(18px, 4vw, 54px);
            color: var(--muted);
            border-top: 1px solid var(--line);
            font-size: 14px;
        }

        .footer p {
            margin: 0;
        }

        /* ----- АДАПТИВНОСТЬ ----- */
        @media (max-width: 1100px) {
            .tools-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 980px) {
            .hero,
            .tool-workspace,
            .lead-box {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: auto;
                padding-top: 24px;
                padding-bottom: 24px;
            }

            .form-panel {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .audience-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .section {
                padding: 34px 16px;
            }

            .tools-grid,
            .audience-grid,
            .lead-row {
                grid-template-columns: 1fr;
            }

            .tool-card {
                min-height: auto;
            }

            .hero-actions,
            .actions,
            .result-actions,
            .cta-strip {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                width: 100%;
                justify-content: center;
            }

            .section-head {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .brand small {
                display: none;
            }

            .nav {
                gap: 4px;
            }

            .nav a {
                padding: 6px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#home" aria-label="НЕЙРОМЕТОД AI">
            <span class="brand-mark">Н</span>
            <span>
                <strong>НЕЙРОМЕТОД AI</strong>
                <small>Инструменты Нейрометод. AI</small>
            </span>
        </a>
        <nav class="nav" aria-label="Основная навигация">
            <a href="#tools">Инструменты</a>
            <a href="#audience">Для кого</a>
            <a href="#lead">Заявка</a>
        </nav>
    </header>

    <main id="app" class="app"></main>

    <footer class="footer">
        <p>НЕЙРОМЕТОД AI. Демо-продукт для проектирования обучения.</p>
        <p>Результаты AI требуют проверки методологом или экспертом предметной области.</p>
    </footer>

                return new Response(JSON.stringify(window.__TOOLS__), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
            if (target.includes('/api/tools/') && target.endsWith('/run')) {
                return new Response(JSON.stringify({
                    toolRunId: 'local_preview',
                    result: {
                        summary: 'Демонстрационный режим. Результат появится после подключения API.',

                        nextStep: 'Свяжитесь с нами для подключения.'
                    }
                }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
            if (target === '/api/leads' || target === '/api/feedback') {
                return new Response(JSON.stringify({ id: 'local_preview', message: 'Заявка принята (демо).' }), { status: 201, headers: { 'Content-Type': 'application/json' } });

    <script>
        const app = document.querySelector("#app");

        const state = {
            tools: [],
            currentResult: null,
            currentRunId: null
        };

        const outputHints = {
            brief: { input: "Сырой запрос заказчика", output: "Бриф, цели, задачи, вопросы, риски" },
            profile: { input: "Описание аудитории и темы обучения", output: "Портрет ЦА, боли, барьеры, мотивация" },
            diagnost: { input: "Гипотеза об аудитории", output: "Диагностическая анкета и логика интерпретации" },
            smyslovik: { input: "Сырой текстовый материал", output: "Темы, алгоритмы, чек-листы, правила" },
            logic: { input: "Структура курса или модуля", output: "Светофор, разрывы, рекомендации" },
            practice: { input: "Тема, теория или учебный результат", output: "Практическое задание, кейс, критерии" }
        };

        const statusLabels = {
            green: "работает",
            yellow: "требует уточнения",
            red: "разрыв",
            neutral: "информация"
        };

        function boot() {
            state.tools = window.__TOOLS__ || [];
            window.addEventListener("hashchange", render);
            render();
        }

        function render() {
            const hash = window.location.hash || "#home";
            const toolMatch = hash.match(/^#tool\/([a-z-]+)$/);
            if (toolMatch) {
                const tool = state.tools.find((item) => item.slug === toolMatch[1]);
                renderToolPage(tool);
                return;
            }
            renderHome();
        }

        function renderHome() {
            app.innerHTML = `
                <section class="section hero section-inner" id="home">
                    <div>
                        <p class="eyebrow">Инструменты Нейрометод. AI</p>
                        <h1>НЕЙРОМЕТОД AI</h1>
                        <p class="hero-subtitle">AI-инструменты для проектирования обучения: от сырого запроса до практических заданий</p>
                        <p class="hero-copy">Витрина помогает методологам, педагогическим дизайнерам и L&D-командам быстро превращать вводные, материалы и фрагменты курса в структурированный методический результат.</p>
                        <div class="hero-actions">
                            <a class="button primary" href="#tools">Открыть инструмент</a>
                            <a class="button secondary" href="#lead">Оставить заявку</a>
                            <a class="button ghost" href="#lead">Обсудить корпоративный пилот</a>
                        </div>
                    </div>
                    <aside class="hero-panel" aria-label="Сценарий работы">
                        <p class="eyebrow">Как работает демо</p>
                        <h2>От запроса к результату в карточках</h2>
                        <div class="flow">
                            <span>Пользователь выбирает инструмент</span>
                            <span>Заполняет форму</span>
                            <span>Backend берёт инструкцию</span>
                            <span>OpenAI возвращает структурированный ответ</span>
                            <span>Frontend показывает результат</span>
                        </div>
                    </aside>
                </section>

                <section class="section" id="tools">
                    <div class="section-inner">
                        <div class="section-head">
                            <div>
                                <p class="eyebrow">6 инструментов</p>
                                <h2>Проектирование обучения по этапам</h2>
                                <p>Каждая карточка ведёт в отдельный рабочий экран с формой, запуском AI и структурированными блоками результата.</p>
                            </div>
                        </div>
                        <div class="tools-grid">
                            ${state.tools.map(renderToolCard).join("")}
                        </div>
                    </div>
                </section>

                <section class="section" id="audience">
                    <div class="section-inner">
                        <div class="section-head">
                            <div>
                                <p class="eyebrow">Для кого</p>
                                <h2>Команды, которые проектируют обучение</h2>
                            </div>
                        </div>
                        <div class="audience-grid">
                            ${["Методологи", "Педдизайнеры", "Корпоративные тренеры", "L&D-команды", "EdTech-команды"].map((item) => `<div class="audience-item">${item}</div>`).join("")}
                        </div>
                    </div>
                </section>

                ${renderLeadSection()}
            `;
            bindLeadForm();
        }

        function renderToolCard(tool) {
            const hints = outputHints[tool.slug] || {};
            return `
                <article class="tool-card">
                    <span class="stage">${escapeHtml(tool.stage)}</span>
                    <div>
                        <h3>${escapeHtml(tool.name)}</h3>
                        <p>${escapeHtml(tool.role)}</p>
                    </div>
                    <dl class="meta-list">
                        <div>
                            <dt>Что на входе</dt>
                            <dd>${escapeHtml(hints.input || tool.inputLabel)}</dd>
                        </div>
                        <div>
                            <dt>Что на выходе</dt>
                            <dd>${escapeHtml(hints.output || "Структурированный методический результат")}</dd>
                        </div>
                    </dl>
                    <a class="button primary" href="#tool/${tool.slug}">Открыть инструмент</a>
                </article>
            `;
        }

        function renderToolPage(tool) {
            if (!tool) {
                app.innerHTML = `<section class="section"><div class="section-inner"><a class="back-link" href="#home">← На главную</a><div class="message error">Инструмент не найден.</div></div></section>`;
                return;
            }

            state.currentResult = null;
            state.currentRunId = null;

            app.innerHTML = `
                <section class="section tool-hero">
                    <div class="section-inner">
                        <a class="back-link" href="#tools">← Все инструменты</a>
                        <div class="tool-page-title">
                            <span class="stage">Этап: ${escapeHtml(tool.stage)}</span>
                            <h1>${escapeHtml(tool.name)}</h1>
                            <p>${escapeHtml(tool.role)}</p>
                            <div class="warning">Не вставляйте конфиденциальные данные компании.</div>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-inner">
                        <div class="tool-workspace">
                            <aside class="form-panel">
                                <h2>${escapeHtml(tool.inputTitle)}</h2>
                                <form class="form" id="tool-form" novalidate>
                                    <div class="field">
                                        <label for="mainText">${escapeHtml(tool.inputLabel || tool.inputTitle)}</label>
                                        <textarea class="main-input" id="mainText" name="mainText" maxlength="${tool.maxLength}" placeholder="${escapeHtml(tool.inputPlaceholder || "")}" required></textarea>
                                        <span class="char-counter" id="char-counter">0 / ${tool.maxLength}</span>
                                    </div>
                                    ${tool.fields.map(renderField).join("")}
                                    <button class="button primary" type="submit">${escapeHtml(tool.buttonLabel)}</button>
                                    <div id="form-message" aria-live="polite"></div>
                                </form>
                            </aside>
                            <section class="result-panel" aria-live="polite">
                                <div id="result-root" class="empty-result">
                                    <div>
                                        <h2>Результат появится здесь</h2>
                                        <p>После запуска backend подставит инструкцию инструмента и вернёт структурированный ответ.</p>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </section>

                ${renderLeadSection(tool.name)}
            `;

            bindToolForm(tool);
            bindLeadForm();
        }

        function renderField(field) {
            if (field.type === "textarea") {
                return `
                    <div class="field">
                        <label for="${field.name}">${escapeHtml(field.label)}</label>
                        <textarea id="${field.name}" name="${field.name}" placeholder="${escapeHtml(field.placeholder || "")}"></textarea>
                    </div>
                `;
            }
            if (field.type === "select") {
                return `
                    <div class="field">
                        <label for="${field.name}">${escapeHtml(field.label)}</label>
                        <select id="${field.name}" name="${field.name}">
                            ${(field.options || []).map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`).join("")}
                        </select>
                    </div>
                `;
            }
            return `
                <div class="field">
                    <label for="${field.name}">${escapeHtml(field.label)}</label>
                    <input id="${field.name}" name="${field.name}" type="text" placeholder="${escapeHtml(field.placeholder || "")}">
                </div>
            `;
        }

        function bindToolForm(tool) {
            const form = document.querySelector("#tool-form");
            const message = document.querySelector("#form-message");
            const resultRoot = document.querySelector("#result-root");
            const mainText = document.querySelector("#mainText");
            const counter = document.querySelector("#char-counter");

            mainText.addEventListener("input", () => {
                counter.textContent = `${mainText.value.length} / ${tool.maxLength}`;
            });

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                message.innerHTML = "";
                const input = Object.fromEntries(new FormData(form).entries());
                const text = (input.mainText || "").trim();

                if (!text) {
                    message.innerHTML = `<div class="message error">Добавьте вводные данные для анализа</div>`;
                    return;
                }
                if (text.length > tool.maxLength) {
                    message.innerHTML = `<div class="message error">Текст слишком длинный для демо-версии. Сократите материал или разбейте его на части.</div>`;
                    return;
                }

                const submitButton = form.querySelector("button[type='submit']");
                submitButton.disabled = true;
                resultRoot.className = "loader";
                resultRoot.innerHTML = `<div><span></span><p>${escapeHtml(tool.loaderText)}</p></div>`;

                try {
                    const response = await fetch(`/api/tools/${tool.slug}/run`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ input })
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(payload.message || "Не удалось получить ответ. Попробуйте повторить запрос");

                    state.currentResult = payload.result;
                    state.currentRunId = payload.toolRunId;
                    renderResult(tool, payload.result, payload.toolRunId);
                } catch (error) {
                    resultRoot.className = "empty-result";
                    resultRoot.innerHTML = `<div class="message error">${escapeHtml(error.message || "Не удалось получить ответ. Попробуйте повторить запрос")}</div>`;
                } finally {
                    submitButton.disabled = false;
                }
            });
        }

        function renderResult(tool, result, toolRunId) {
            const resultRoot = document.querySelector("#result-root");
            const entries = Object.entries(result || {});
            resultRoot.className = "";
            resultRoot.innerHTML = `
                <div class="result-actions">
                    <div>
                        <h2>Результат</h2>
                        <p>Структурированные блоки для дальнейшей методической работы.</p>
                    </div>
                    <button class="button secondary" type="button" id="copy-result">Скопировать результат</button>
                </div>
                <div class="result-grid">
                    ${entries.map(([key, value]) => renderResultCard(tool, key, value)).join("")}
                </div>
                <div class="cta-strip">
                    <strong>Хотите адаптировать инструмент под вашу команду?</strong>
                    <a class="button primary" href="#lead">Обсудить корпоративный пилот</a>
                </div>
                <div class="feedback">
                    <span>Оцените результат:</span>
                    ${[1, 2, 3, 4, 5].map((rating) => `<button type="button" data-rating="${rating}" aria-label="Оценка ${rating}">${rating}</button>`).join("")}
                    <span id="feedback-message"></span>
                </div>
            `;

            document.querySelector("#copy-result").addEventListener("click", async () => {
                await navigator.clipboard.writeText(formatResultForCopy(tool, result));
                const btn = document.querySelector("#copy-result");
                btn.textContent = "Скопировано";
                setTimeout(() => { if (btn) btn.textContent = "Скопировать результат"; }, 1600);
            });

            document.querySelectorAll("[data-rating]").forEach((button) => {
                button.addEventListener("click", () => sendFeedback(toolRunId, Number(button.dataset.rating)));
            });
        }

        function renderResultCard(tool, key, value) {
            const title = tool.outputLabels?.[key] || humanizeKey(key);
            return `
                <article class="result-card">
                    <h3>${escapeHtml(title)}</h3>
                    ${renderValue(value)}
                </article>
            `;
        }

        function renderValue(value) {
            if (Array.isArray(value)) {
                if (!value.length) return `<p>Нет данных.</p>`;
                return `<ul>${value.map((item) => `<li>${renderInlineValue(item)}</li>`).join("")}</ul>`;
            }
            if (value && typeof value === "object") {
                if ("status" in value && "comment" in value) {
                    const status = escapeHtml(value.status || "neutral");
                    return `<div class="check-row"><span class="status-dot status-${status}"></span><div><strong>${escapeHtml(statusLabels[value.status] || value.status)}</strong><p>${escapeHtml(value.comment || "")}</p></div></div>`;
                }
                return `<dl class="meta-list">${Object.entries(value).map(([k, v]) => `<div><dt>${escapeHtml(humanizeKey(k))}</dt><dd>${renderInlineValue(v)}</dd></div>`).join("")}</dl>`;
            }
            if (["green", "yellow", "red"].includes(value)) {
                return `<div class="check-row"><span class="status-dot status-${value}"></span><strong>${escapeHtml(statusLabels[value])}</strong></div>`;
            }
            return `<p>${escapeHtml(String(value || "Нет данных."))}</p>`;
        }

        function renderInlineValue(value) {
            if (value && typeof value === "object") {
                return Object.entries(value)
                    .map(([k, v]) => `<strong>${escapeHtml(humanizeKey(k))}:</strong> ${escapeHtml(String(v))}`)
                    .join("<br>");
            }
            return escapeHtml(String(value));
        }

        function formatResultForCopy(tool, result) {
            return Object.entries(result || {})
                .map(([key, value]) => {
                    const title = tool.outputLabels?.[key] || humanizeKey(key);
                    return `${title}\n${formatPlain(value)}`;
                })
                .join("\n\n");
        }

        function formatPlain(value) {
            if (Array.isArray(value)) {
                return value.map((item) => `- ${formatPlain(item)}`).join("\n");
            }
            if (value && typeof value === "object") {
                return Object.entries(value).map(([k, v]) => `${humanizeKey(k)}: ${formatPlain(v)}`).join("\n");
            }
            return String(value || "");
        }

        function renderLeadSection(interestedTool = "") {
            return `
                <section class="section" id="lead">
                    <div class="section-inner">
                        <div class="lead-box">
                            <div>
                                <p class="eyebrow">Заявка</p>
                                <h2>Оставить заявку</h2>
                                <p>Можно обсудить демо, корпоративный пилот или адаптацию инструкций под вашу команду.</p>
                                <div class="warning">Не вставляйте конфиденциальные данные компании.</div>
                            </div>
                            <form class="lead-form" id="lead-form" novalidate>
                                <div class="lead-row">
                                    <div class="field">
                                        <label for="lead-name">Имя</label>
                                        <input id="lead-name" name="name" type="text" required>
                                    </div>
                                    <div class="field">
                                        <label for="lead-contact">Email или Telegram</label>
                                        <input id="lead-contact" name="contact" type="text" required>
                                    </div>
                                </div>
                                <div class="lead-row">
                                    <div class="field">
                                        <label for="lead-company">Компания</label>
                                        <input id="lead-company" name="company" type="text">
                                    </div>
                                    <div class="field">
                                        <label for="lead-role">Роль</label>
                                        <input id="lead-role" name="role" type="text">
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="lead-tool">Интересующий инструмент</label>
                                    <input id="lead-tool" name="interestedTool" type="text" value="${escapeHtml(interestedTool)}">
                                </div>
                                <div class="field">
                                    <label for="lead-comment">Комментарий</label>
                                    <textarea id="lead-comment" name="comment" placeholder="Что хотите обсудить"></textarea>
                                </div>
                                <button class="button primary" type="submit">Оставить заявку</button>
                                <div id="lead-message" aria-live="polite"></div>
                            </form>
                        </div>
                    </div>
                </section>
            `;
        }

        function bindLeadForm() {
            const form = document.querySelector("#lead-form");
            if (!form) return;
            const message = document.querySelector("#lead-message");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const submitButton = form.querySelector("button[type='submit']");
                submitButton.disabled = true;
                message.innerHTML = "";

                try {
                    const payload = Object.fromEntries(new FormData(form).entries());
                    const response = await fetch("/api/leads", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const body = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(body.message || "Не удалось отправить заявку");
                    form.reset();
                    message.innerHTML = `<div class="message success">Заявка отправлена. Спасибо!</div>`;
                } catch (error) {
                    message.innerHTML = `<div class="message error">${escapeHtml(error.message || "Не удалось отправить заявку")}</div>`;
                } finally {
                    submitButton.disabled = false;
                }
            });
        }

        async function sendFeedback(toolRunId, rating) {
            const msgEl = document.querySelector("#feedback-message");
            if (!toolRunId) {
                msgEl.textContent = "Оценка доступна после запуска.";
                return;
            }
            try {
                const response = await fetch("/api/feedback", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ toolRunId, rating, comment: "" })
                });
                if (!response.ok) throw new Error("feedback");
                msgEl.textContent = "Спасибо, оценка сохранена.";
            } catch (error) {
                msgEl.textContent = "Не удалось сохранить оценку.";
            }
        }

        function humanizeKey(key) {
            return key
                .replace(/([A-Z])/g, " $1")
                .replace(/_/g, " ")
                .trim()
                .toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        boot();
    </script>
</body>
</html>
